<!doctype html>
<html lang="sq">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{{subject}}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f6f7f5;font-family:Arial,Helvetica,sans-serif;color:#14201b;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f6f7f5;padding:36px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e2e5e1;border-radius:12px;overflow:hidden;">
            <tr><td style="height:5px;background-color:#0f7b5a;font-size:0;line-height:0;">&nbsp;</td></tr>
            <tr>
              <td style="padding:28px 32px 12px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td width="34" height="34" align="center" valign="middle" style="width:34px;height:34px;border-radius:8px;background-color:#0f7b5a;color:#ffffff;font-size:19px;font-weight:bold;">E</td>
                    <td style="padding-left:10px;color:#14201b;font-size:18px;font-weight:bold;letter-spacing:-0.2px;">EnergyFlow</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px 32px;">
                <p style="margin:0 0 9px;color:#0f7b5a;font-size:12px;font-weight:bold;letter-spacing:1.2px;text-transform:uppercase;">{{eyebrow}}</p>
                <h1 style="margin:0 0 14px;color:#14201b;font-size:26px;line-height:1.25;font-weight:700;">{{heading}}</h1>
                <p style="margin:0 0 22px;color:#4a5751;font-size:15px;line-height:1.65;">{{intro}}</p>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 22px;">
                  <tr><td align="center" bgcolor="#0f7b5a" style="border-radius:7px;"><a href="{{link}}" target="_blank" style="display:inline-block;padding:13px 22px;border:1px solid #0f7b5a;border-radius:7px;color:#ffffff;font-size:15px;font-weight:bold;text-decoration:none;">{{button_text}}</a></td></tr>
                </table>
                <p style="margin:0 0 7px;color:#78837d;font-size:12px;line-height:1.55;">{{expiration_notice}}</p>
                <p style="margin:0 0 7px;color:#78837d;font-size:12px;line-height:1.55;">{{fallback_intro}}</p>
                <p style="margin:0;word-break:break-all;font-size:12px;line-height:1.6;"><a href="{{link}}" target="_blank" style="color:#0f7b5a;text-decoration:underline;">{{link}}</a></p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-top:24px;">
                  <tr><td style="border-top:1px solid #e2e5e1;font-size:0;line-height:0;">&nbsp;</td></tr>
                </table>
                <p style="margin:18px 0 0;color:#78837d;font-size:12px;line-height:1.6;">{{ignore_notice}}</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;color:#78837d;font-size:11px;line-height:1.5;">EnergyFlow · {{footer}}</p>
        </td>
      </tr>
    </table>
  </body>
</html>
