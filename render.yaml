# Render Blueprint for the EnergyFlow API (free web service, Docker).
# Docker paths are relative to the repo ROOT, not rootDir.
services:
  - type: web
    name: energyflow-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "0"
      - key: SESSION_SECURE
        value: "1"
      - key: SESSION_TTL_DAYS
        value: "7"
      # Aiven for MySQL (free). Host and port come from the Aiven console.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        value: avnadmin
      - key: DB_PASS
        sync: false
      # Paste the full Aiven CA certificate (ca.pem) here.
      - key: DB_SSL_CA_CONTENT
        sync: false
      - key: CRON_SECRET
        generateValue: true
      # Root of the derived device secrets. Never change it after devices are provisioned.
      - key: APP_KEY
        generateValue: true
      # Optional: fixed password for the demo owner account (owner@ylli-plast.demo).
      - key: DEMO_OWNER_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_FALLBACK
        value: openai/gpt-oss-20b
