<VirtualHost *:${PORT}>
    ServerName localhost
    # Only public/ is web-reachable. .env, src/, database/, bin/ and tests/ live
    # outside the document root and can never be served.
    DocumentRoot /var/www/energyflow/public

    <Directory /var/www/energyflow/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        # Every request that is not a real file goes to the front controller.
        FallbackResource /index.php
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always unset X-Powered-By

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
