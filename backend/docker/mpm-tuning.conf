# Render free instances have 512 MB of RAM and Aiven's free MySQL allows a limited
# number of connections; each busy worker holds one PDO connection. Raise both together.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers       12
    MaxConnectionsPerChild 500
</IfModule>

ServerTokens Prod
ServerSignature Off
